name: YouthVerse Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: youthverse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-build:
    name: Build, Emulator Tests & APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22 for Firebase tools
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          yes 2>/dev/null | sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          set -o pipefail
          sdkmanager --list_installed | grep -E 'platforms;android-36(\.1)?|build-tools;36\.0\.0|platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      # Bootstrap the official wrapper in an empty temporary project. This avoids evaluating
      # YouthVerse's Android build just to create the wrapper and never fabricates a JAR.
      - name: Generate official Gradle Wrapper
        run: |
          set -euo pipefail
          BOOTSTRAP_DIR="${RUNNER_TEMP}/youthverse-wrapper-bootstrap"
          mkdir -p "${BOOTSTRAP_DIR}"
          printf "rootProject.name = 'youthverse-wrapper-bootstrap'\n" > "${BOOTSTRAP_DIR}/settings.gradle"
          gradle -p "${BOOTSTRAP_DIR}" wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin \
            --no-daemon \
            --stacktrace
          install -m 755 "${BOOTSTRAP_DIR}/gradlew" ./gradlew
          install -m 644 "${BOOTSTRAP_DIR}/gradlew.bat" ./gradlew.bat
          mkdir -p gradle/wrapper
          install -m 644 "${BOOTSTRAP_DIR}/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          install -m 644 "${BOOTSTRAP_DIR}/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Validate official Gradle Wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

      - name: Create temporary Android debug signing key
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Phase 4 security checks
        run: node scripts/verify-phase4.mjs

      - name: Verify Phase 5 authentication checks
        run: node scripts/verify-phase5.mjs

      - name: Verify Phase 6 deletion checks
        run: node scripts/verify-phase6.mjs

      - name: Verify Phase 7 environment
        run: node scripts/verify-phase7.mjs

      - name: Restore optional google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -f app/google-services.json ]; then
            if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
              printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            elif [ -n "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
              printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              echo "Notice: app/google-services.json not present and no secret configured; proceeding with MissingGoogleServicesStrategy.WARN."
            fi
          fi

      - name: Verify Android package and Firebase identity
        run: npm run verify:android-package

      - name: Install Firebase CLI and Admin SDK dependencies
        run: npm install --no-audit --no-fund

      - name: Run Cloud Functions unit tests
        run: npm run test:functions

      - name: Compile Android debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      # Starts Firestore + Auth emulators, runs JS Security Rules tests, seeds an emulator-only
      # admin custom claim, then runs the Robolectric repository tests against those emulators.
      - name: Run Firestore Rules and Android repository emulator tests
        run: npm run test:emulator-suite

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: youthverse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated official Gradle Wrapper
        if: always() && hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''
        uses: actions/upload-artifact@v6
        with:
          name: youthverse-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports and Firebase emulator log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: youthverse-build-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
